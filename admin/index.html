<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STRUCTURA LABS | Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Montserrat',sans-serif;
background:#EEF2F6;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:24px;

}

.card{

width:100%;
max-width:560px;
background:white;
border-radius:28px;
padding:42px;
border:1px solid #E5E7EB;
box-shadow:0 18px 45px rgba(8,60,116,.08);

}

/* ---------- HEADER ---------- */

.logo{

display:block;
width:180px;
height:auto;
margin:0 auto 28px;

}

h1{

font-size:36px;
font-weight:700;
text-align:center;
color:#083C74;
letter-spacing:-0.8px;
margin-bottom:10px;

}

.subtitle{

text-align:center;
font-size:15px;
font-weight:500;
color:#6B7280;
margin-bottom:34px;

}

/* ---------- FORM ---------- */

label{

display:block;
font-size:13px;
font-weight:600;
color:#374151;
margin-bottom:8px;
margin-top:18px;

}

input{

width:100%;
height:56px;
padding:0 18px;
border:1px solid #D7DCE2;
border-radius:14px;
font-size:16px;
font-family:inherit;
transition:.2s;

}

input:focus{

outline:none;
border-color:#083C74;
box-shadow:0 0 0 4px rgba(8,60,116,.08);

}

button{

width:100%;
height:58px;
margin-top:28px;
background:#083C74;
color:white;
border:none;
border-radius:14px;
font-size:17px;
font-weight:600;
cursor:pointer;
transition:.25s;

}

button:hover{

background:#062E5A;
transform:translateY(-1px);

}

/* ---------- SECURITY ---------- */

.security{

margin-top:24px;
padding-top:22px;
border-top:1px solid #E5E7EB;
text-align:center;
font-size:12px;
line-height:1.6;
color:#6B7280;

}

/* ---------- MOBILE ---------- */

@media(max-width:640px){

.card{

padding:30px 24px;

}

.logo{

width:150px;

}

h1{

font-size:30px;

}

}

</style>

</head>

<body>

<div class="card">

<img src="../logo.jpg"
alt="STRUCTURA LABS"
class="logo">

<h1>Admin Dashboard</h1>

<p class="subtitle">

STRUCTURA Report Management Portal

</p>

<form>

<label>Email</label>

<input
type="email"
placeholder="Enter your email">

<label>Password</label>

<input
type="password"
placeholder="Enter your password">

<button type="button">

Login

</button>

</form>

<div class="security">

Protected Admin Area

<br>

STRUCTURA INFRA TESTING LABS PRIVATE LIMITED

</div>

</div>

</body>

</html>
