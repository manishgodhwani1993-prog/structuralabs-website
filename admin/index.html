<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STRUCTURA Admin Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="dashboard.css">

</head>

<body>

<div class="layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <img src="../logo.jpg" alt="STRUCTURA LABS" class="logo">

        <div class="menu">

            <button class="active">🏠 Dashboard</button>

            <button onclick="window.location.href='/admin/pages/new-report.html'">
                📄 New Report
            </button>

            <button onclick="window.location.href='/admin/pages/reports.html'">
                📁 Reports
            </button>

            <button onclick="window.location.href='/admin/pages/clients.html'">
                👥 Clients
            </button>

            <button onclick="window.location.href='/admin/pages/settings.html'">
                ⚙️ Settings
            </button>

        </div>

    </aside>

    <!-- Main Content -->

    <main class="main">

        <div class="header">

            <div>

                <h1>Dashboard</h1>

                <div class="subtitle">
                    STRUCTURA Report Management System
                </div>

            </div>

        </div>

        <!-- Statistics -->

        <div class="stats">

            <div class="card">
                <h3>Reports Today</h3>
                <div class="value">0</div>
            </div>

            <div class="card">
                <h3>This Month</h3>
                <div class="value">0</div>
            </div>

            <div class="card">
                <h3>Clients</h3>
                <div class="value">0</div>
            </div>

            <div class="card">
                <h3>Pending</h3>
                <div class="value">0</div>
            </div>

        </div>

        <!-- Quick Actions -->

        <div class="quick">

            <button onclick="window.location.href='/admin/pages/new-report.html'">
                ➕ New Report
            </button>

            <button onclick="window.location.href='/admin/pages/reports.html'">
                🔍 Search Reports
            </button>

            <button onclick="window.location.href='/admin/pages/clients.html'">
                👥 Clients
            </button>

        </div>

    </main>

</div>

</body>
</html>
