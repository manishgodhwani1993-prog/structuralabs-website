<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STRUCTURA Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="dashboard.css">

</head>

<body>

<div class="layout">

<aside class="sidebar">

<img src="../logo.jpg" class="logo">

<div class="menu">

<button class="active">🏠 Dashboard</button>

<button onclick="goPage('new-report')">📄 New Report</button>

<button onclick="goPage('reports')">📁 Reports</button>

<button onclick="goPage('clients')">👥 Clients</button>

<button onclick="goPage('settings')">⚙️ Settings</button>

</div>

</aside>

<main class="main">

<div class="header">

<div>

<h1>Dashboard</h1>

<div class="subtitle">
STRUCTURA Report Management System
</div>

</div>

</div>

<div class="stats">

<div class="card">
<h3>Reports Today</h3>
<div class="value">0</div>
</div>

<div class="card">
<h3>This Month</h3>
<div class="value">0</div>
</div>

<div class="card">
<h3>Clients</h3>
<div class="value">0</div>
</div>

<div class="card">
<h3>Pending</h3>
<div class="value">0</div>
</div>

</div>

<div class="quick">

<button onclick="goPage('new-report')">
➕ New Report
</button>

<button onclick="goPage('reports')">
🔍 Search Reports
</button>

<button onclick="goPage('clients')">
👥 Clients
</button>

</div>

</main>

</div>

<script src="dashboard.js"></script>

</body>
</html>
