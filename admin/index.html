<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STRUCTURA LABS | Admin Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Montserrat',sans-serif;
background:#EEF2F6;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:28px;

}

.container{

width:100%;
max-width:760px;
background:white;
border:1px solid #E5E7EB;
border-radius:28px;
padding:40px 54px 46px;
box-shadow:0 18px 50px rgba(8,60,116,.08);

}

/* ---------- Logo ---------- */

.logo{

display:block;
margin:0 auto;
width:165px;
height:auto;

}

/* ---------- Header ---------- */

.header{

text-align:center;
margin-top:18px;
margin-bottom:38px;

}

.header h1{

font-size:48px;
font-weight:700;
color:#083C74;
letter-spacing:-1px;

}

.header p{

margin-top:10px;
font-size:21px;
font-weight:500;
color:#64748B;

}

.security{

margin-top:16px;
font-size:13px;
font-weight:500;
letter-spacing:2px;
text-transform:uppercase;
color:#94A3B8;

}

/* ---------- Form ---------- */

.form-group{

margin-bottom:24px;

}

label{

display:block;
margin-bottom:10px;
font-size:16px;
font-weight:600;
color:#1E3A5F;

}

input{

width:100%;
height:64px;
padding:0 22px;
border:1px solid #D6DCE5;
border-radius:16px;
font-size:18px;
font-family:inherit;
outline:none;
transition:.25s;

}

input::placeholder{

color:#94A3B8;

}

input:focus{

border-color:#083C74;
box-shadow:0 0 0 4px rgba(8,60,116,.08);

}

/* ---------- Button ---------- */

button{

width:100%;
height:64px;
margin-top:8px;
border:none;
border-radius:16px;
background:#083C74;
color:white;
font-family:inherit;
font-size:20px;
font-weight:600;
cursor:pointer;
transition:.25s;

}

button:hover{

background:#062D5A;
transform:translateY(-1px);

}

/* ---------- Footer ---------- */

.footer{

margin-top:34px;
padding-top:22px;
border-top:1px solid #E5E7EB;
text-align:center;
font-size:13px;
line-height:1.7;
color:#64748B;

}

.footer strong{

color:#083C74;

}

/* ---------- Mobile ---------- */

@media(max-width:768px){

body{

padding:14px;

}

.container{

padding:30px 24px 34px;

}

.logo{

width:140px;

}

.header{

margin-top:16px;
margin-bottom:30px;

}

.header h1{

font-size:36px;

}

.header p{

font-size:18px;

}

.security{

font-size:11px;
letter-spacing:1.5px;

}

input,
button{

height:58px;
font-size:17px;

}

}

</style>

</head>

<body>

<div class="container">

<img src="../logo.jpg"
alt="STRUCTURA LABS Logo"
class="logo">

<div class="header">

<h1>Admin Portal</h1>

<p>Report Management System</p>

<div class="security">
Authorized Personnel Only
</div>

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
placeholder="Enter your email">

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
placeholder="Enter your password">

</div>

<button>
Login
</button>

<div class="footer">

<strong>STRUCTURA INFRA TESTING LABS PRIVATE LIMITED</strong>

<br>

Internal Laboratory Management Portal • Ambernath, Maharashtra

</div>

</div>

</body>
</html>
