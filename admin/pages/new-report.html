<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Report</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:Montserrat,sans-serif;
background:#EEF2F6;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:35px;
border-radius:22px;
}

h1{
color:#083C74;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.full{
grid-column:1/-1;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
}

input,select{
width:100%;
padding:15px;
border:1px solid #D6DCE5;
border-radius:12px;
font-family:inherit;
}

button{
margin-top:25px;
padding:18px;
width:100%;
background:#083C74;
color:white;
border:none;
border-radius:14px;
font-size:18px;
font-weight:600;
cursor:pointer;
}

button:hover{
background:#062D5A;
}

</style>

</head>

<body>

<div class="container">

<h1>New Report</h1>

<div class="grid">

<div>

<label>Sample ID</label>

<input value="STS-26-000001" readonly>

</div>

<div>

<label>Report Number</label>

<input value="STL-26-000001" readonly>

</div>

<div class="full">

<label>Client Name</label>

<input placeholder="ABC Construction Pvt Ltd">

</div>

<div>

<label>Material Category</label>

<select>

<option>Concrete</option>

<option>Cement</option>

<option>Sand</option>

<option>Aggregate</option>

<option>Soil</option>

</select>

</div>

<div>

<label>Test Type</label>

<select>

<option>Compressive Strength</option>

<option>Mix Design</option>

<option>Slump Test</option>

</select>

</div>

<div>

<label>Sample Grade</label>

<input placeholder="M30">

</div>

<div>

<label>Quantity</label>

<input placeholder="3 Cubes">

</div>

<div class="full">

<label>Upload Signed PDF</label>

<input type="file" accept=".pdf">

</div>

</div>

<button>
Publish Report
</button>

</div>

</body>
</html>
