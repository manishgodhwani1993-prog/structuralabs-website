<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Report | STRUCTURA LABS</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Montserrat',sans-serif;
background:#EEF3F8;
padding:35px;
color:#1F2937;
}

.container{
max-width:820px;
margin:auto;
background:#fff;
padding:40px;
border-radius:24px;
box-shadow:0 12px 35px rgba(0,0,0,.08);
}

.logo{
display:block;
margin:auto;
width:190px;
margin-bottom:25px;
}

h1{
text-align:center;
font-size:38px;
font-weight:800;
color:#0B4A92;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#64748B;
margin-bottom:35px;
}

.form-group{
margin-bottom:22px;
}

label{
display:block;
font-weight:700;
margin-bottom:8px;
color:#334155;
}

input,select{
width:100%;
height:54px;
padding:0 16px;
border:1px solid #D6DEE8;
border-radius:14px;
font-size:16px;
font-family:inherit;
}

input:focus,select:focus{
outline:none;
border-color:#0B4A92;
box-shadow:0 0 0 3px rgba(11,74,146,.10);
}

input[type=file]{
height:auto;
padding:14px;
}

.status-box{
height:54px;
display:flex;
align-items:center;
padding:0 16px;
background:#ECFDF5;
border:1px solid #BBF7D0;
border-radius:14px;
color:#166534;
font-weight:700;
}

button{
width:100%;
height:58px;
border:none;
border-radius:16px;
background:#0B4A92;
color:white;
font-size:18px;
font-weight:700;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#08376E;
}

.message{
display:none;
margin-top:25px;
padding:18px;
border-radius:14px;
font-weight:600;
text-align:center;
}

.success{
background:#ECFDF5;
color:#166534;
}

.error{
background:#FEE2E2;
color:#991B1B;
}

.back{
display:inline-block;
margin-bottom:25px;
color:#0B4A92;
text-decoration:none;
font-weight:700;
}

@media(max-width:768px){

body{
padding:18px;
}

.container{
padding:28px 22px;
}

.logo{
width:150px;
}

h1{
font-size:30px;
}

}

</style>
</head>

<body>

<div class="container">

<a href="../index.html" class="back">← Back to Dashboard</a>

<img src="/logo.jpg" class="logo" alt="STRUCTURA LABS">

<h1>Upload Report</h1>

<p class="subtitle">
Upload a signed report for customer verification.
</p>

<form id="reportForm">

<div class="form-group">
<label>Report Number *</label>
<input type="text" id="report_number" placeholder="SITL/26-27/000001" required>
</div>

<div class="form-group">
<label>Sample ID *</label>
<input type="text" id="sample_id" placeholder="SMID/26-27/000001" required>
</div>

<div class="form-group">
<label>Client Name *</label>
<input type="text" id="client_name" required>
</div>

<div class="form-group">
<label>Material Category *</label>
<select id="material_category" required>
<option value="">Select Material</option>
<option>Cement</option>
<option>Concrete</option>
<option>Coarse Aggregate</option>
<option>Fine Aggregate</option>
<option>Soil</option>
<option>Bitumen</option>
<option>Bricks</option>
<option>Blocks</option>
<option>Tiles</option>
<option>Steel</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label>Test Name *</label>
<input type="text" id="test_name" placeholder="Compressive Strength" required>
</div>

<div class="form-group">
<label>Issue Date *</label>
<input type="date" id="issue_date" required>
</div>

<div class="form-group">
<label>Status</label>
<div class="status-box">✔ Verified</div>
</div>

<div class="form-group">
<label>Signed Report (PDF) *</label>
<input type="file" id="pdf" accept="application/pdf" required>
</div>

<button type="submit">
Publish Report
</button>

</form>

<div id="success" class="message success"></div>
<div id="error" class="message error"></div>

</div>

<script>

const API="https://structura-api.manishgodhwani1993.workers.dev";

document.getElementById("reportForm").addEventListener("submit",async(e)=>{

e.preventDefault();

const success=document.getElementById("success");
const error=document.getElementById("error");

success.style.display="none";
error.style.display="none";

const form=new FormData();

form.append("report_number",document.getElementById("report_number").value.trim());
form.append("sample_id",document.getElementById("sample_id").value.trim());
form.append("client_name",document.getElementById("client_name").value.trim());
form.append("material_category",document.getElementById("material_category").value);
form.append("test_name",document.getElementById("test_name").value.trim());
form.append("issue_date",document.getElementById("issue_date").value);
form.append("status","Verified");
form.append("pdf",document.getElementById("pdf").files[0]);

try{

const response=await fetch(`${API}/publish`,{
method:"POST",
body:form
});

const data=await response.json();

if(!response.ok||!data.success){

throw new Error(data.message||"Publish failed");

}

success.innerHTML=`
Report published successfully.<br><br>
<b>Report Number:</b> ${data.report_number}<br>
<b>Verification:</b><br>
<a href="${data.verify_url}" target="_blank">${data.verify_url}</a>
`;

success.style.display="block";

document.getElementById("reportForm").reset();

}catch(err){

error.textContent=err.message;
error.style.display="block";

}

});

</script>

</body>
</html>
