<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Sample | STRUCTURA LABS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Montserrat,sans-serif;
background:#eef3f8;
padding:40px 20px;
color:#17375e;
}
.container{
max-width:1100px;
margin:auto;
background:#fff;
padding:40px;
border-radius:24px;
box-shadow:0 12px 35px rgba(0,0,0,.08);
}
h1{
font-size:42px;
font-weight:800;
margin-bottom:30px;
color:#0d3f7f;
}
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:22px;
}
.full{grid-column:1/-1;}
label{
display:block;
font-size:15px;
font-weight:700;
margin-bottom:8px;
color:#111827;
}
input,select{
width:100%;
padding:16px 18px;
border:1px solid #d7dde5;
border-radius:14px;
font-family:inherit;
font-size:15px;
}
input[readonly]{
background:#f8fafc;
font-weight:600;
}
button{
width:100%;
margin-top:30px;
padding:18px;
background:#0d3f7f;
color:#fff;
border:none;
border-radius:14px;
font-size:18px;
font-weight:700;
cursor:pointer;
}
button:hover{
background:#0a3366;
}
#status{
display:none;
margin-top:20px;
padding:18px;
border-radius:14px;
line-height:1.6;
}
.success{
background:#ecfdf5;
color:#065f46;
}
.error{
background:#fef2f2;
color:#991b1b;
}
@media(max-width:768px){
.grid{grid-template-columns:1fr;}
.container{padding:25px;}
}
</style>
</head>

<body>

<div class="container">

<h1>New Sample</h1>

<form id="sampleForm">

<div class="grid">

<div>
<label>Report Number</label>
<input id="report_number" readonly placeholder="Auto Generated on Publish">
</div>

<div>
<label>Sample ID</label>
<input id="sample_id" readonly placeholder="Auto Generated on Publish">
</div>

<div class="full">
<label>Client Name</label>
<input id="client_name" required placeholder="Enter Client Name">
</div>

<div>
<label>Material Category</label>
<select id="material_category" required>
<option value="">Select Material</option>
<option>Concrete</option>
<option>Cement</option>
<option>Fine Aggregate</option>
<option>Coarse Aggregate</option>
<option>Soil</option>
<option>Bricks</option>
<option>Concrete Blocks</option>
<option>Paver Blocks</option>
<option>Tiles</option>
<option>Steel</option>
<option>Bitumen</option>
<option>Construction Chemical</option>
<option>Other</option>
</select>
</div>

<div>
<label>Test Name</label>
<input id="test_name" required placeholder="Example: Compressive Strength">
</div>

<div>
<label>IS Code</label>
<input id="is_code" placeholder="Example: IS 516">
</div>

<div>
<label>IS Part</label>
<input id="is_part" placeholder="Example: Part 1">
</div>

<div>
<label>Sample Grade</label>
<input id="sample_grade" placeholder="Example: M30">
</div>

<div>
<label>Quantity</label>
<input id="quantity" placeholder="Example: 3 Cubes">
</div>

<div>
<label>Received Date</label>
<input type="date" id="received_date" required>
</div>

<div>
<label>Received Time</label>
<input type="time" id="received_time" required>
</div>

<div class="full">
<label>Issue Date</label>
<input type="date" id="issue_date" required>
</div>

<div class="full">
<label>Upload Signed PDF</label>
<input type="file" id="pdf" accept="application/pdf" required>
</div>

</div>

<button type="submit">Publish Report</button>

<div id="status"></div>

</form>

</div>

<script>

const API="https://structura-api.manishgodhwani1993.workers.dev";

const today=new Date();

document.getElementById("received_date").value=today.toISOString().split("T")[0];
document.getElementById("issue_date").value=today.toISOString().split("T")[0];
document.getElementById("received_time").value=today.toTimeString().slice(0,5);

document.getElementById("sampleForm").addEventListener("submit",async(e)=>{

e.preventDefault();

const form=new FormData();

[
"client_name",
"material_category",
"test_name",
"is_code",
"is_part",
"sample_grade",
"quantity",
"received_date",
"received_time",
"issue_date"
].forEach(id=>{
form.append(id,document.getElementById(id).value);
});

form.append("pdf",document.getElementById("pdf").files[0]);

const status=document.getElementById("status");

status.style.display="block";
status.className="";
status.innerHTML="Publishing report...";

try{

const response=await fetch(API+"/publish",{
method:"POST",
body:form
});

const data=await response.json();

document.getElementById("report_number").value=data.report_number;
document.getElementById("sample_id").value=data.sample_id;

status.className="success";

status.innerHTML=`
<b>Report Published Successfully</b><br><br>

<b>Report Number:</b> ${data.report_number}<br>

<b>Sample ID:</b> ${data.sample_id}<br>

<b>Verification:</b><br>

<a href="${data.verify_url}" target="_blank">${data.verify_url}</a>
`;

}catch(error){

status.className="error";
status.innerHTML="Failed to publish report.";

}

});

</script>

</body>
</html>
