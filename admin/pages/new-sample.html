<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STRUCTURA LABS | New Sample</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
--navy:#083C74;
--green:#0C8A73;
--bg:#EEF2F6;
--border:#D8DEE8;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Montserrat',sans-serif;
background:var(--bg);
padding:30px;
}

.container{
max-width:1180px;
margin:auto;
background:white;
padding:42px;
border-radius:24px;
box-shadow:0 12px 35px rgba(0,0,0,.05);
}

.header{margin-bottom:32px;}

h1{
font-size:40px;
font-weight:700;
color:var(--navy);
}

.subtitle{
margin-top:8px;
font-size:15px;
color:#64748B;
}

.section-title{
margin:36px 0 18px;
padding-bottom:10px;
font-size:20px;
font-weight:700;
color:var(--navy);
border-bottom:1px solid #E5E7EB;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:22px;
}

.full{grid-column:1/-1;}

label{
display:block;
margin-bottom:8px;
font-weight:600;
font-size:15px;
}

input,select,textarea{
width:100%;
padding:15px;
border:1px solid var(--border);
border-radius:14px;
font-family:'Montserrat',sans-serif;
font-size:15px;
}

input[readonly]{
background:#F7F9FC;
font-weight:600;
color:var(--navy);
}

textarea{
min-height:90px;
resize:vertical;
}

.actions{
display:flex;
gap:18px;
margin-top:36px;
}

.primary{
flex:1;
padding:18px;
background:var(--navy);
color:white;
border:none;
border-radius:16px;
font-size:18px;
font-weight:700;
cursor:pointer;
}

.secondary{
padding:18px 28px;
background:white;
border:1px solid var(--border);
border-radius:16px;
font-weight:600;
cursor:pointer;
}

.primary:hover{background:#062D5A;}
.secondary:hover{background:#F8FAFC;}

@media(max-width:768px){

.container{padding:24px;}
.grid{grid-template-columns:1fr;}
.actions{flex-direction:column;}
h1{font-size:32px;}

}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>New Sample Registration</h1>
<div class="subtitle">Register every incoming sample before testing begins.</div>
</div>

<div class="section-title">Sample Receipt</div>

<div class="grid">

<div>
<label>Sample ID</label>
<input id="sampleId" readonly>
</div>

<div>
<label>Sample Receipt Date *</label>
<input type="date" id="receiptDate" required>
</div>

<div>
<label>Sample Receipt Time *</label>
<input type="time" id="receiptTime" required>
</div>

<div>
<label>Received By</label>
<input placeholder="Technician / Staff Name">
</div>

</div>

<div class="section-title">Client Information</div>

<div class="grid">

<div class="full">
<label>Client Name *</label>
<input placeholder="ABC Construction Pvt Ltd">
</div>

<div>
<label>Project Name</label>
<input placeholder="Bridge / Building / Road Project">
</div>

<div>
<label>Site Location</label>
<input placeholder="Ambernath MIDC">
</div>

<div>
<label>Contact Person</label>
<input placeholder="Site Engineer">
</div>

<div>
<label>Mobile Number</label>
<input placeholder="9876543210">
</div>

</div>

<div class="section-title">Sample Information</div>

<div class="grid">

<div>
<label>Material Category *</label>

<select id="material" onchange="updateTests()">

<option value="">Select Material</option>

<option>Concrete</option>
<option>Cement</option>
<option>Fine Aggregate</option>
<option>Coarse Aggregate</option>
<option>Soil</option>
<option>Bitumen</option>
<option>Construction Chemicals</option>
<option>Water</option>
<option>Bricks / Blocks</option>
<option>Tiles</option>
<option>Steel</option>
<option>Other</option>

</select>

</div>

<div>
<label>Test Requested *</label>

<input
id="testType"
list="testSuggestions"
placeholder="Select or type the required test">

<datalist id="testSuggestions"></datalist>

</div>

<div>
<label>Grade / Specification</label>
<input placeholder="Example: M30 / OPC 53 / IS Code">
</div>

<div>
<label>Quantity</label>
<input placeholder="Example: 3 Cubes">
</div>

<div>
<label>Sample Condition</label>

<select>

<option>Good</option>
<option>Wet</option>
<option>Dry</option>
<option>Damaged</option>

</select>

</div>

<div>
<label>Priority</label>

<select>

<option>Normal</option>
<option>Urgent</option>

</select>

</div>

<div class="full">
<label>Remarks</label>
<textarea placeholder="Any special instructions..."></textarea>
</div>

<div class="full">
<label>Upload Sample Photos (Optional)</label>
<input type="file" multiple accept="image/*">
</div>

</div>

<div class="actions">

<button class="secondary" onclick="history.back()">
Cancel
</button>

<button class="primary">
Register Sample
</button>

</div>

</div>

<script>

function getFinancialYear(){

const d=new Date();

let start,end;

if(d.getMonth()>=3){

start=d.getFullYear();
end=d.getFullYear()+1;

}else{

start=d.getFullYear()-1;
end=d.getFullYear();

}

return `${String(start).slice(-2)}-${String(end).slice(-2)}`;

}

let sequence=1;

document.getElementById("sampleId").value=
`SMID/${getFinancialYear()}/${String(sequence).padStart(6,"0")}`;

const now=new Date();

document.getElementById("receiptDate").value=
now.toISOString().slice(0,10);

document.getElementById("receiptTime").value=
`${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;

const tests={

"Concrete":[
"Cube Compressive Strength",
"Flexural Strength",
"Split Tensile Strength",
"Slump Test",
"Density",
"Mix Design",
"Water Permeability",
"Rapid Chloride Permeability (RCPT)"
],

"Cement":[
"Fineness",
"Standard Consistency",
"Initial Setting Time",
"Final Setting Time",
"Soundness",
"Compressive Strength"
],

"Fine Aggregate":[
"Sieve Analysis",
"Silt Content",
"Specific Gravity",
"Water Absorption",
"Bulk Density"
],

"Coarse Aggregate":[
"Sieve Analysis",
"Specific Gravity",
"Water Absorption",
"Crushing Value",
"Impact Value",
"Flakiness Index",
"Elongation Index",
"Los Angeles Abrasion"
],

"Soil":[
"Moisture Content",
"Sieve Analysis",
"Atterberg Limits",
"Proctor Test",
"CBR Test",
"Field Density"
],

"Bitumen":[
"Penetration",
"Softening Point",
"Ductility",
"Viscosity"
],

"Construction Chemicals":[
"Adhesion",
"Flow",
"Compressive Strength"
],

"Water":[
"pH",
"TDS",
"Chloride",
"Sulphate",
"Alkalinity"
],

"Bricks / Blocks":[
"Compressive Strength",
"Water Absorption",
"Efflorescence",
"Dimensions"
],

"Tiles":[
"Water Absorption",
"Breaking Strength",
"Abrasion Resistance",
"Dimensions"
],

"Steel":[
"Tensile Test",
"Bend Test",
"Rebend Test",
"Elongation"
]

};

function updateTests(){

const material=document.getElementById("material").value;
const datalist=document.getElementById("testSuggestions");
const input=document.getElementById("testType");

datalist.innerHTML="";
input.value="";

if(!tests[material]) return;

tests[material].forEach(test=>{

const option=document.createElement("option");
option.value=test;
datalist.appendChild(option);

});

}

</script>

</body>
</html>
