
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STRUCTURA LABS | Report Verification</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Montserrat',sans-serif;
background:#EEF2F6;
padding:35px 18px;
min-height:100vh;

}

.container{

max-width:960px;
margin:auto;
background:white;
padding:46px 44px;
border-radius:26px;
border:1px solid #E5E7EB;
box-shadow:0 14px 38px rgba(8,60,116,.08);

}

/* ---------- HEADER ---------- */

.logo-section{

text-align:center;
margin-bottom:38px;

}

.logo{

width:74px;
height:74px;
object-fit:contain;
margin-bottom:22px;

}

.logo-section h1{

font-size:64px;
font-weight:700;
letter-spacing:-1.8px;
line-height:1;
color:#083C74;

}

.subtitle{

margin-top:18px;
font-size:20px;
font-weight:500;
color:#0D8B6F;

}

.verify-title{

margin-top:18px;
font-size:12px;
font-weight:500;
letter-spacing:4px;
text-transform:uppercase;
color:#6B7280;

}

/* ---------- SEARCH ---------- */

.search{

display:flex;
gap:16px;
margin-bottom:34px;

}

.search input{

flex:1;
height:72px;
padding:0 24px;
font-size:18px;
font-weight:500;
border-radius:18px;
border:1px solid #D7DCE2;
outline:none;
transition:.2s;

}

.search input::placeholder{

color:#7C8794;

}

.search input:focus{

border-color:#083C74;
box-shadow:0 0 0 4px rgba(8,60,116,.08);

}

.search button{

width:132px;
height:72px;
border:none;
border-radius:18px;
background:#083C74;
color:white;
font-size:18px;
font-weight:600;
cursor:pointer;
transition:.25s;

}

.search button:hover{

background:#062E5A;

}

/* ---------- RESULT CARD ---------- */

.card{

border:1px solid #E5E7EB;
border-radius:20px;
padding:30px;
animation:fade .35s ease;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(10px);

}

to{

opacity:1;
transform:translateY(0);

}

}

/* ---------- VERIFIED ---------- */

.verified-header{

display:flex;
align-items:center;
gap:16px;
margin-bottom:28px;

}

.shield{

width:58px;
height:58px;
border-radius:50%;
background:#0D8B6F;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:28px;
font-weight:700;

}

.verified-header h2{

font-size:28px;
font-weight:700;
color:#0D8B6F;

}

.verified-header p{

margin-top:4px;
font-size:14px;
color:#6B7280;

}

/* ---------- ERROR ---------- */

.red{

font-size:26px;
font-weight:700;
color:#D93025;

}

/* ---------- DETAILS ---------- */

.row{

display:flex;
justify-content:space-between;
align-items:center;
padding:16px 0;
border-bottom:1px solid #EEF1F4;
gap:20px;

}

.row span{

font-size:16px;
font-weight:500;
color:#5B6470;

}

.row strong{

font-size:18px;
font-weight:600;
color:#111827;
text-align:right;

}

/* ---------- REPORT BOX ---------- */

.report-box{

display:flex;
align-items:center;
gap:10px;

}

.report-box button{

padding:7px 12px;
border:none;
border-radius:8px;
background:#083C74;
color:white;
font-size:13px;
font-weight:600;
cursor:pointer;

}

/* ---------- DOWNLOAD ---------- */

.download{

display:block;
margin-top:30px;
height:62px;
line-height:62px;
text-align:center;
background:#0D8B6F;
border-radius:16px;
color:white;
font-size:18px;
font-weight:600;
text-decoration:none;
transition:.25s;

}

.download:hover{

background:#0A725B;

}

/* ---------- FOOTER ---------- */

.footer{

margin-top:34px;
text-align:center;
font-size:13px;
line-height:1.6;
color:#6B7280;

}

/* ---------- MOBILE ---------- */

@media(max-width:768px){

.container{

padding:28px 22px;
margin:12px;

}

.logo{

width:60px;
height:60px;

}

.logo-section h1{

font-size:40px;

}

.subtitle{

font-size:17px;

}

.search{

flex-direction:column;

}

.search button{

width:100%;

}

.row{

flex-direction:column;
align-items:flex-start;
gap:6px;

}

.row strong{

text-align:left;

}

.verified-header{

flex-direction:column;
text-align:center;

}

}

</style>

</head>

<body>

<div class="container">

<div class="logo-section">

<img src="../logo.jpg"
     alt="STRUCTURA LABS Logo"
     class="logo">

<h1>STRUCTURA LABS</h1>

<div class="subtitle">

Results You Can Build On

</div>

<div class="verify-title">

Official Report Verification Portal

</div>

</div>

<div class="search">

<input id="searchInput"
placeholder="Enter Report Number (e.g. STL-26-000123)">

<button onclick="verifyReport()">

Verify

</button>

</div>

<div id="result"></div>

<div class="footer">

STRUCTURA INFRA TESTING LABS PRIVATE LIMITED

<br>

Ambernath • Maharashtra

</div>

</div>

<script src="app.js"></script>

</body>
</html>
