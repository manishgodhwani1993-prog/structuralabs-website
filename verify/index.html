<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Verify Report | STRUCTURA LABS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Montserrat,sans-serif;
background:#eef3f8;
color:#17375e;
}

.container{
max-width:850px;
margin:60px auto;
padding:30px;
}

.card{
background:#fff;
border-radius:24px;
padding:40px;
box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.logo{
text-align:center;
margin-bottom:10px;
}

.logo img{
height:62px;
}

h1{
text-align:center;
font-size:34px;
font-weight:800;
color:#0d3f7f;
margin-top:15px;
}

.subtitle{
text-align:center;
color:#64748b;
margin:10px 0 35px;
}

.search{
display:flex;
gap:12px;
margin-bottom:30px;
flex-wrap:wrap;
}

.search input{
flex:1;
padding:16px;
border:1px solid #d5dce5;
border-radius:14px;
font-size:16px;
}

.search button{
padding:16px 28px;
background:#0d3f7f;
color:#fff;
border:none;
border-radius:14px;
font-weight:700;
cursor:pointer;
}

.result{
display:none;
margin-top:20px;
border-top:1px solid #e5e7eb;
padding-top:30px;
}

.badge{
display:inline-block;
background:#16a34a;
color:#fff;
padding:8px 18px;
border-radius:999px;
font-size:14px;
font-weight:700;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

td{
padding:12px 0;
border-bottom:1px solid #edf2f7;
vertical-align:top;
}

td:first-child{
font-weight:700;
width:42%;
color:#475569;
}

.download{
display:inline-block;
margin-top:30px;
padding:14px 24px;
background:#0d3f7f;
color:white;
text-decoration:none;
border-radius:12px;
font-weight:700;
}

.notfound{
display:none;
margin-top:25px;
padding:18px;
border-radius:14px;
background:#fef2f2;
color:#991b1b;
font-weight:600;
}

@media(max-width:700px){

.card{padding:25px;}

.search{
flex-direction:column;
}

.search button{
width:100%;
}

h1{
font-size:28px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
<img src="/banner.png" alt="STRUCTURA LABS">
</div>

<h1>Verify Test Report</h1>

<div class="subtitle">

Enter the official Report Number or scan the QR Code.

</div>

<div class="search">

<input
id="reportInput"
placeholder="Example: SITL/26-27/000001">

<button onclick="verifyReport()">

Verify

</button>

</div>

<div class="notfound" id="notfound">

Report not found.

</div>

<div class="result" id="result">

<div class="badge">

✔ VERIFIED

</div>

<table>

<tr>
<td>Report Number</td>
<td id="r_report"></td>
</tr>

<tr>
<td>Sample ID</td>
<td id="r_sample"></td>
</tr>

<tr>
<td>Client Name</td>
<td id="r_client"></td>
</tr>

<tr>
<td>Material</td>
<td id="r_material"></td>
</tr>

<tr>
<td>Test</td>
<td id="r_test"></td>
</tr>

<tr>
<td>IS Code</td>
<td id="r_is"></td>
</tr>

<tr>
<td>Issue Date</td>
<td id="r_issue"></td>
</tr>

<tr>
<td>Status</td>
<td id="r_status"></td>
</tr>

</table>

<a
id="pdfLink"
class="download"
target="_blank">

Download Original Signed PDF

</a>

</div>

</div>

</div>

<script>

const API="https://structura-api.manishgodhwani1993.workers.dev";

async function verifyReport(number){

const reportNo=number||document.getElementById("reportInput").value.trim();

if(!reportNo)return;

document.getElementById("result").style.display="none";
document.getElementById("notfound").style.display="none";

const res=await fetch(
API+"/verify/"+encodeURIComponent(reportNo)
);

const data=await res.json();

if(!data.found){

document.getElementById("notfound").style.display="block";

return;

}

const r=data.report;

document.getElementById("result").style.display="block";

document.getElementById("r_report").innerText=r.report_number;
document.getElementById("r_sample").innerText=r.sample_id;
document.getElementById("r_client").innerText=r.client_name;
document.getElementById("r_material").innerText=r.material_category;
document.getElementById("r_test").innerText=r.test_name;
document.getElementById("r_is").innerText=
`${r.is_code||"-"} ${r.is_part||""}`;

document.getElementById("r_issue").innerText=r.issue_date;
document.getElementById("r_status").innerText=r.status;

document.getElementById("pdfLink").href=
API+r.pdf_url;

}

const path=window.location.pathname.split("/");

if(path.length>2){

const report=decodeURIComponent(path.slice(2).join("/"));

document.getElementById("reportInput").value=report;

verifyReport(report);

}

</script>

</body>

</html>
