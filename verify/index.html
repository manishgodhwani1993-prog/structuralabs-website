<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Verify Test Report | STRUCTURA LABS</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
background:#eef3f8;
padding:40px 20px;
}

.container{
max-width:1200px;
margin:auto;
background:#fff;
border-radius:30px;
padding:50px;
box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.logo{
display:block;
margin:auto;
width:220px;
margin-bottom:25px;
}

h1{
text-align:center;
color:#0B4A92;
font-size:58px;
font-weight:800;
margin-bottom:12px;
}

.subtitle{
text-align:center;
font-size:18px;
color:#64748B;
margin-bottom:35px;
}

.search{
display:flex;
gap:18px;
margin-bottom:35px;
flex-wrap:wrap;
}

.search input{
flex:1;
min-width:250px;
padding:20px 24px;
font-size:20px;
border:1px solid #d5dee9;
border-radius:18px;
outline:none;
}

.btn{
border:none;
cursor:pointer;
padding:20px 28px;
border-radius:18px;
font-size:20px;
font-weight:700;
transition:.25s;
}

.verify-btn{
background:#0B4A92;
color:white;
}

.verify-btn:hover{
background:#08366d;
}

.scan-btn{
background:#0E8B7E;
color:white;
}

.scan-btn:hover{
background:#0a6c62;
}

#qr-reader{
margin:25px auto;
max-width:360px;
display:none;
}

.result{
margin-top:35px;
display:none;
}

.badge{
display:inline-block;
background:#16A34A;
color:white;
padding:10px 22px;
border-radius:999px;
font-weight:700;
margin-bottom:25px;
}

.report{
display:grid;
grid-template-columns:1fr 1fr;
gap:35px;
align-items:start;
}

.qrbox{
text-align:center;
}

.qrbox img{
width:220px;
border:1px solid #d9d9d9;
border-radius:16px;
padding:10px;
background:white;
}

.details{
display:flex;
flex-direction:column;
}

.row{
display:grid;
grid-template-columns:220px 1fr;
padding:18px 0;
border-bottom:1px solid #E5E7EB;
}

.label{
font-weight:700;
color:#334E68;
}

.value{
color:#111827;
}

.download{
display:inline-block;
margin-top:35px;
padding:18px 26px;
background:#0B4A92;
color:white;
text-decoration:none;
font-weight:700;
border-radius:16px;
}

.download:hover{
background:#08366d;
}

.error{
display:none;
margin-top:25px;
padding:18px;
border-radius:14px;
background:#FEE2E2;
color:#991B1B;
font-weight:600;
}

@media(max-width:768px){

.container{
padding:28px;
}

.logo{
width:170px;
}

h1{
font-size:42px;
}

.subtitle{
font-size:17px;
}

.search{
flex-direction:column;
}

.search input,
.btn{
width:100%;
font-size:18px;
}

.report{
grid-template-columns:1fr;
}

.row{
grid-template-columns:1fr;
gap:8px;
}

.qrbox img{
width:200px;
}

}

</style>
</head>

<body>

<div class="container">

<img src="../logo.jpg" class="logo" alt="STRUCTURA LABS">

<h1>Verify Test Report</h1>

<p class="subtitle">
Enter the official Report Number or scan the QR Code.
</p>

<div class="search">

<input
id="reportInput"
placeholder="Example: SITL/26-27/000001">

<button class="btn verify-btn" onclick="verifyReport()">
Verify
</button>

<button class="btn scan-btn" onclick="toggleScanner()">
📷 Scan QR
</button>

</div>

<div id="qr-reader"></div>

<div id="error" class="error"></div>

<div id="result" class="result">

<div class="badge">
✓ VERIFIED REPORT
</div>

<div class="report">

<div class="details">

<div class="row">
<div class="label">Report Number</div>
<div class="value" id="report_number"></div>
</div>

<div class="row">
<div class="label">Sample ID</div>
<div class="value" id="sample_id"></div>
</div>

<div class="row">
<div class="label">Client Name</div>
<div class="value" id="client_name"></div>
</div>

<div class="row">
<div class="label">Material Category</div>
<div class="value" id="material_category"></div>
</div>

<div class="row">
<div class="label">Test Name</div>
<div class="value" id="test_name"></div>
</div>

<div class="row">
<div class="label">IS Code</div>
<div class="value" id="is_code"></div>
</div>

<div class="row">
<div class="label">Issue Date</div>
<div class="value" id="issue_date"></div>
</div>

<div class="row">
<div class="label">Status</div>
<div class="value" id="status"></div>
</div>

<a id="downloadBtn" class="download" target="_blank">
Download Original Signed PDF
</a>

</div>

<div class="qrbox">

<img id="qrImage" alt="Verification QR">

</div>

</div>

</div>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>

const API="https://structura-api.manishgodhwani1993.workers.dev";

const params=new URLSearchParams(window.location.search);
const autoReport=params.get("report");

if(autoReport){
document.getElementById("reportInput").value=autoReport;
window.onload=()=>verifyReport();
}

async function verifyReport(){

const report=document.getElementById("reportInput").value.trim();

document.getElementById("error").style.display="none";
document.getElementById("result").style.display="none";

if(!report){
showError("Please enter Report Number.");
return;
}

try{

const res=await fetch(`${API}/verify/${encodeURIComponent(report)}`);
const data=await res.json();

if(!data.found){
showError("Report not found.");
return;
}

const r=data.report;

document.getElementById("report_number").textContent=r.report_number;
document.getElementById("sample_id").textContent=r.sample_id;
document.getElementById("client_name").textContent=r.client_name;
document.getElementById("material_category").textContent=r.material_category;
document.getElementById("test_name").textContent=r.test_name;
document.getElementById("is_code").textContent=r.is_code||"-";
document.getElementById("issue_date").textContent=r.issue_date;
document.getElementById("status").textContent=r.status;

document.getElementById("downloadBtn").href=
`${API}/download/${encodeURIComponent(r.report_number)}`;

document.getElementById("qrImage").src=
`https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(r.qr_url)}`;

document.getElementById("result").style.display="block";

}catch(e){

showError("Unable to connect to verification server.");

}

}

function showError(msg){

const err=document.getElementById("error");
err.textContent=msg;
err.style.display="block";

}

let scanner;

function toggleScanner(){

const box=document.getElementById("qr-reader");

if(box.style.display==="block"){

box.style.display="none";

if(scanner){
scanner.stop().catch(()=>{});
}

return;

}

box.style.display="block";

scanner=new Html5Qrcode("qr-reader");

scanner.start(

{facingMode:"environment"},

{fps:10,qrbox:250},

(decoded)=>{

scanner.stop();

box.style.display="none";

window.location.href=decoded;

},

()=>{}

);

}

</script>

</body>
</html>
