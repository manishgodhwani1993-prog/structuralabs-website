<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Verify Test Report | STRUCTURA LABS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Montserrat',sans-serif;
background:#eef3f8;
color:#17375e;
}

.container{
max-width:900px;
margin:70px auto;
padding:20px;
}

.card{
background:#fff;
border-radius:26px;
padding:50px 45px;
box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.logo{
text-align:center;
margin-bottom:18px;
}

.logo img{
height:84px;
width:auto;
display:block;
margin:auto;
}

h1{
text-align:center;
font-size:46px;
font-weight:800;
color:#0d3f7f;
margin-bottom:12px;
}

.subtitle{
text-align:center;
font-size:17px;
color:#64748b;
margin-bottom:35px;
}

.search{
display:flex;
gap:14px;
flex-wrap:wrap;
margin-bottom:30px;
}

.search input{
flex:1;
padding:18px 20px;
border:1px solid #d6dde6;
border-radius:16px;
font-size:17px;
font-family:inherit;
}

.search button{
padding:18px 34px;
background:#0d3f7f;
color:white;
border:none;
border-radius:16px;
font-size:17px;
font-weight:700;
cursor:pointer;
transition:.25s;
}

.search button:hover{
background:#0a3366;
}

.result{
display:none;
margin-top:25px;
padding-top:30px;
border-top:1px solid #e5e7eb;
}

.badge{
display:inline-block;
background:#16a34a;
color:white;
padding:8px 20px;
border-radius:999px;
font-size:14px;
font-weight:700;
margin-bottom:22px;
}

.qr-box{
text-align:center;
margin-bottom:28px;
}

.qr-box img{
width:170px;
height:170px;
padding:10px;
background:white;
border:1px solid #d8dee6;
border-radius:16px;
}

table{
width:100%;
border-collapse:collapse;
}

td{
padding:14px 0;
border-bottom:1px solid #edf2f7;
vertical-align:top;
}

td:first-child{
width:42%;
font-weight:700;
color:#475569;
}

.download{
display:inline-block;
margin-top:30px;
padding:15px 26px;
background:#0d3f7f;
color:white;
text-decoration:none;
border-radius:14px;
font-weight:700;
transition:.25s;
}

.download:hover{
background:#0a3366;
}

.notfound{
display:none;
margin-top:22px;
padding:18px;
background:#fef2f2;
color:#991b1b;
border-radius:14px;
font-weight:600;
}

@media(max-width:768px){

.card{
padding:30px 24px;
}

.logo img{
height:70px;
}

h1{
font-size:34px;
}

.subtitle{
font-size:15px;
}

.search{
flex-direction:column;
}

.search button{
width:100%;
}

td{
display:block;
padding:8px 0;
border:none;
}

td:first-child{
width:100%;
padding-top:16px;
font-size:14px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="logo">
<img src="/logo.png" alt="STRUCTURA LABS Logo">
</div>

<h1>Verify Test Report</h1>

<div class="subtitle">
Enter the official Report Number or scan the QR Code.
</div>

<div class="search">

<input
id="reportInput"
placeholder="Example: SITL/26-27/000001">

<button onclick="verifyReport()">
Verify
</button>

</div>

<div id="notfound" class="notfound">
Report not found.
</div>

<div id="result" class="result">

<div class="badge">
✔ VERIFIED
</div>

<div class="qr-box">
<img id="qrImage" src="" alt="Verification QR">
</div>

<table>

<tr>
<td>Report Number</td>
<td id="r_report"></td>
</tr>

<tr>
<td>Sample ID</td>
<td id="r_sample"></td>
</tr>

<tr>
<td>Client Name</td>
<td id="r_client"></td>
</tr>

<tr>
<td>Material Category</td>
<td id="r_material"></td>
</tr>

<tr>
<td>Test Name</td>
<td id="r_test"></td>
</tr>

<tr>
<td>IS Code</td>
<td id="r_is"></td>
</tr>

<tr>
<td>Issue Date</td>
<td id="r_issue"></td>
</tr>

<tr>
<td>Status</td>
<td id="r_status"></td>
</tr>

</table>

<a
id="pdfLink"
class="download"
target="_blank">
Download Original Signed PDF
</a>

</div>

</div>

</div>

<script>

const API="https://structura-api.manishgodhwani1993.workers.dev";

async function verifyReport(reportNo){

const number=reportNo || document.getElementById("reportInput").value.trim();

if(!number) return;

document.getElementById("result").style.display="none";
document.getElementById("notfound").style.display="none";

try{

const response=await fetch(
API+"/verify/"+encodeURIComponent(number)
);

const data=await response.json();

if(!data.found){

document.getElementById("notfound").style.display="block";
return;

}

const r=data.report;

document.getElementById("result").style.display="block";

document.getElementById("r_report").textContent=r.report_number;
document.getElementById("r_sample").textContent=r.sample_id;
document.getElementById("r_client").textContent=r.client_name;
document.getElementById("r_material").textContent=r.material_category;
document.getElementById("r_test").textContent=r.test_name;
document.getElementById("r_is").textContent=
`${r.is_code || "-"} ${r.is_part || ""}`;
document.getElementById("r_issue").textContent=r.issue_date;
document.getElementById("r_status").textContent=r.status;

document.getElementById("pdfLink").href=
API+r.pdf_url;

document.getElementById("qrImage").src=
`https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent("https://structuralabs.in/verify/"+r.report_number)}`;

}catch(err){

document.getElementById("notfound").style.display="block";

}

}

const parts=window.location.pathname.split("/");

if(parts.length>2){

const report=decodeURIComponent(parts.slice(2).join("/"));

document.getElementById("reportInput").value=report;

verifyReport(report);

}

</script>

</body>

</html>
