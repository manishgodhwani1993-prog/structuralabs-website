
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRUCTURA LABS Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Montserrat,sans-serif;
background:#eef2f6;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:40px;
border-radius:24px;
box-shadow:0 12px 35px rgba(0,0,0,.08);
width:420px;
text-align:center;
}

img{
width:180px;
margin-bottom:20px;
}

h1{
color:#083C74;
font-size:28px;
margin-bottom:10px;
}

p{
color:#666;
margin-bottom:30px;
}

input{
width:100%;
padding:15px;
border-radius:12px;
border:1px solid #ddd;
margin-bottom:15px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:#083C74;
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
}

button:hover{
background:#062d5a;
}
</style>

</head>
<body>

<div class="card">

<img src="../logo.jpg" alt="STRUCTURA Logo">

<h1>Admin Dashboard</h1>

<p>STRUCTURA Report Management Portal</p>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button>Login</button>

</div>

</body>
</html>
